name: Build and deploy Angular Forecast Web

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: YOUR_ANGULAR_APP_SERVICE_NAME
  DIST_PATH: dist/Forecast.Web

jobs:
  build:
    name: Build Angular application
    runs-on: ubuntu-latest
    environment: ForecastApiapi_Env

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Verify build output
        run: |
          echo "Angular build output:"
          ls -la dist
          echo ""
          echo "Forecast.Web output:"
          ls -la dist/Forecast.Web

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: ${{ env.DIST_PATH }}

  deploy:
    name: Deploy Angular application to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: ForecastApiapi_Env

    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-app
          path: ${{ env.DIST_PATH }}

      - name: Verify deployment package
        run: |
          echo "Deployment package:"
          ls -la ${{ env.DIST_PATH }}

          echo ""
          echo "Server files:"
          ls -la ${{ env.DIST_PATH }}/server || true

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ForecastApiapi_CLIENT_ID_8975 }}
          tenant-id: ${{ vars.ForecastApiapi_TENANT_ID_5F92 }}
          subscription-id: ${{ vars.ForecastApiapi_SUBSCRIPTION_ID_5F92 }}

      - name: Deploy Angular application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.DIST_PATH }}
          startup-command: node server/server.mjs
          slot-name: production

      - name: Azure Logout
        run: az logout
