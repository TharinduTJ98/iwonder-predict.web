# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Angular SSR app to Azure Web App - iwonder-predict-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test Angular SSR app
        run: |
          npm run build -- --configuration production
          npm test -- --watch=false

      - name: Prepare SSR runtime package
        run: |
          cp package.json package-lock.json dist/Forecast.Web/
          npm ci --omit=dev --prefix dist/Forecast.Web
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: angular-ssr-app
          path: dist/Forecast.Web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: angular-ssr-app
          path: dist/Forecast.Web
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D9DAA8B9296D43719919B6B4D038B1C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9B3D55518693444F95D75268009005CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D377825BAC9D49DFAA4E3850364575F8 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'iwonder-predict-web'
          slot-name: 'Production'
          package: dist/Forecast.Web
          startup-command: node server/server.mjs
          