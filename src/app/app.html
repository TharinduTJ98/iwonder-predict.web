<div class="workspace-shell" *ngIf="auth.isAuthenticated()">
	<aside class="sidebar" aria-label="Main navigation">
		<a class="brand" routerLink="/dashboard">
			<span class="brand-mark" aria-hidden="true">IW</span>
			<span class="brand-name">I-Wonder<span>Forecasts</span></span>
		</a>

		<div class="nav-caption">WORKSPACE</div>
		<nav class="primary-nav">
			<a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
				<span class="nav-icon" aria-hidden="true">▦</span>
				<span>Overview</span>
			</a>
			<a class="nav-item" routerLink="/comparison" routerLinkActive="active">
				<span class="nav-icon" aria-hidden="true">⇄</span>
				<span>Panel comparison</span>
			</a>
		</nav>

		<div class="sidebar-footer">
			<span class="status-dot" aria-hidden="true"></span>
			<span>Forecast data</span>
			<button type="button" class="sign-out" (click)="signOut()" aria-label="Sign out" title="Sign out">
				<span aria-hidden="true">↪</span>
			</button>
		</div>
	</aside>

	<main class="main-content">
		<router-outlet></router-outlet>
	</main>
</div>
<router-outlet *ngIf="!auth.isAuthenticated()"></router-outlet>
